<!DOCTYPE html>
<html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор QR-кодов</title>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>

<link href="css/main.css" rel="stylesheet"/>

<style></style>

</head>
<body>
		<div class="container">
<div class="container">
	<!-- Светящиеся сферы на фоне, без которых эффект стекла не будет виден -->
	<div class="bg-glow blob-1"></div> <div class="bg-glow blob-2"></div>
	<!-- Главная стеклянная карточка -->
	<div class="glass-card">
		<h2 class="card-title">Темы оформления</h2>
		<p class="card-subtitle">Настройте визуальный стиль вашего пространства.</p>
		<div class="control-group">
			<span class="label">Цветовой акцент</span>
			<!-- Пример активной неоновой кнопки -->
			<button class="neon-button">Coral</button>
		</div>
	</div>
</div>
 
<div class="container">
	<!-- Светящиеся сферы на фоне, без которых эффект стекла не будет виден -->
	<div class="bg-glow blob-2"></div> <div class="bg-glow blob-1"></div>
	<div class="glass-card">
		<div class=control-group">
			
		<button class="neon-button" id="create-default-qrs-btn1" type="button">Показать QR-зон</button>
		
		</div>
		<div id="qrcode1" hidden></div>
		
		<div class=control-group">
			
		<button class="neon-button" id="create-default-qrs-btn2" type="button">Показать QR-hranenie</button>
		</div>
		
		<div id="qrcode2" hidden></div>
	</div>
</div>
<div class="container">
	<!-- Светящиеся сферы на фоне, без которых эффект стекла не будет виден -->
	<div class="bg-glow blob-1"></div> <div class="bg-glow blob-2"></div>
	<div class="glass-card" >
		<h2 class="card-title">Генератор QR</h2>
		<textarea id="text-input" placeholder="Введите текст или URL (каждый в новой строке)" rows="5" cols="30"></textarea>
		<br>
		<button class="neon-button" id="generate-btn">Сгенерировать QR-коды</button>
		<button class="neon-button" id="save-pdf-btn">Сохранить в PDF</button>
		<div class="card" id="qrcode-list"></div>
	</div>
</div>
		</div>




    <script>


    $('#create-default-qrs-btn1').on('click', function () {
    const list = $('#qrcode1');

    // Создать QR-коды только при первом нажатии
    if (!list.data('created')) {
      const defaultTexts = [
        {name: 'Сортировка', text: '46818'},
        {name: 'Подготовка к отгрузке', text: '46800'},
        {name: 'Курьеры', text: '46803'}, 
									{name: 'Приемка лотов/Отгрузка', text: '46799'}
      ];

      defaultTexts.forEach(function (qr) {
        const item = $('<div class="qrcode-item" class="qrcode-style" ></div>');

        item.qrcode({
          width: 240,
          height: 240,
          text: qr.text
        });

        item.append(
      $('<p class="qr-name"></p>').text(qr.name)
    );


        list.append(item);
      });
      list.data('created', true);
    }
    // Переключить видимость
    const hide = !list.prop('hidden'); list.prop('hidden', hide); $(this).text(hide ? 'Показать QR-зон' : 'Скрыть QR-зон');
  });






    $('#create-default-qrs-btn2').on('click', function () {
    const list = $('#qrcode2');

    // Создать QR-коды только при первом нажатии
    if (!list.data('created')) {
      const defaultTexts = [
        {name: 'hranenie 1', text: '8110933'},
        {name: 'hranenie 2', text: '8111046'},
        {name: 'Vybroshennye', text: '25423'}
      ];

      defaultTexts.forEach(function (qr) {
        const item = $('<div class="qrcode-item" class="qrcode-style" ></div>');

        item.qrcode({
          width: 240,
          height: 240,
          text: qr.text
        });

        item.append(
      $('<p class="qr-name"></p>').text(qr.name)
    );


        list.append(item);
      });

      list.data('created', true);
    }

    // Переключить видимость
    const hide = !list.prop('hidden');
    list.prop('hidden', hide);
    $(this).text(hide ? 'Показать QR-hranenie' : 'Скрыть QR-hranenie');
  });



        $(document).ready(function() {
            $('#generate-btn').click(function() {
                var inputTexts = $('#text-input').val().split('\n');
                $('#qrcode-list').empty(); // Очистка предыдущих QR-кодов

                inputTexts.forEach(function(inputText) {
                    inputText = inputText.trim(); // Удаление лишних пробелов
                    if (inputText) {
                        var qrcodeItem = $('<div class="qrcode-item" class="qrcode-style" ></div>');
                        qrcodeItem.qrcode(inputText);
                        qrcodeItem.append('<p>' + inputText + '</p>');

                        // Кнопка удаления
                        var deleteBtn = $('<span class="delete-btn">Удалить</span>');
                        deleteBtn.click(function() {
                            qrcodeItem.remove();
                        });
                        qrcodeItem.append(deleteBtn);

                        $('#qrcode-list').append(qrcodeItem);
                    }
                });
            });

            $('#save-pdf-btn').click(function() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const qrCodeSize = 100; // Ширина и высота QR-кода

                $('#qrcode-list .qrcode-item').each(function(index) {
                    var qrCodeCanvas = $(this).find('canvas')[0];
                    var imgData = qrCodeCanvas.toDataURL('image/png');

                    // Отцентрируем QR-код
                    const xPosition = (pageWidth - qrCodeSize) / 2; // Центрирование по горизонтали
                    const yPosition = (pageHeight - qrCodeSize) / 2; // Центрирование по вертикали

                    doc.addImage(imgData, 'PNG', xPosition, yPosition, qrCodeSize, qrCodeSize);

                    // Текст под QR-кодом
                    const text = $(this).find('p').text();
                    const textWidth = doc.getTextWidth(text); // Получаем ширину текста
                    const textXPosition = (pageWidth - textWidth) / 2; // Центрирование текста по горизонтали

                    // Устанавливаем размер и жирность шрифта
                    doc.setFontSize(16); // Размер шрифта
                    doc.setFont("helvetica", "bold"); // Жирный шрифт
                    doc.text(text, textXPosition, yPosition + qrCodeSize + 15); // Отступ для текста

                    if (index < $('#qrcode-list .qrcode-item').length - 1) {
                        doc.addPage(); // Добавляем новую страницу для следующего QR-кода
                    }
                });

                doc.save('qrcodes.pdf');
            });
        });
    </script>


</body></html>
